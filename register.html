<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="/css/register.css" rel="stylesheet">
    <script src="/javascript/htmx.min.js" defer></script>
</head>

<body>
    <div class="container">
        <img src="/images/logo.webp" alt="Logo" width="64" height="64">
        <form class="form">
            <div>
                <h4 class="container_title">Welcome to the App</h4>
                <p class="container__subtitle">
                    We're happy to see you back in town!
                </p>
            </div>
            <fieldset class="form__field">
                <label for="email" class="form__label">Email</label>
                <input class="form__input" name="email" placeholder="Enter your email" type="email" required>
            </fieldset>
            <fieldset class="form__field">
                <label for="password" class="form__label">Password</label>
                <input name="password" class="form__input" placeholder="Choose a strong password" type="password"
                    required>
            </fieldset>
            <fieldset
                style="border: 0; display: flex; align-items: center; gap: 0.5rem; padding-inline:0; padding-block:0;">
                <input name="announcements" type="checkbox" id="announcements" required>
                <label for="announcements" class="container__subtitle">I want to receive announcements and updates via
                    email.</label>
            </fieldset>
            <p class=" form__text">If you have an account, click <a href="/login" class="form__link">
                    here</a>. if you lost your password, click <a href="/recover" class="form__link">
                    here</a>.</p>
            <button type="submit" class="btn" data-variant="secondary">
                Submit
            </button>
        </form>
    </div>
</body>

</html>
